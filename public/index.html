<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydra | Authentication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00bfff;
            --bg: #0a0a0a;
            --card: rgba(255, 255, 255, 0.03);
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(0, 191, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 191, 255, 0.05) 0%, transparent 50%);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .glass-card {
            background: var(--card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid var(--accent);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-weight: 700;
            letter-spacing: 5px;
            margin: 0;
            color: var(--accent);
            text-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 11px;
            color: var(--accent);
            margin-bottom: 8px;
            margin-left: 5px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            color: white;
            border-radius: 8px;
            font-size: 13px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--accent);
            background: rgba(0, 191, 255, 0.05);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: black;
            border: none;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0, 191, 255, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 191, 255, 0.5);
            background: white;
        }

        .info-box {
            margin-top: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            font-size: 12px;
            color: #666;
            line-height: 1.6;
        }

        #status {
            margin-top: 15px;
            font-size: 12px;
            font-weight: 600;
            min-height: 18px;
        }

        .loading-dots:after {
            content: '.';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            40% { color: var(--accent); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            60% { text-shadow: .25em 0 0 var(--accent), .5em 0 0 rgba(0,0,0,0); }
            80%, 100% { text-shadow: .25em 0 0 var(--accent), .5em 0 0 var(--accent); }
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <h1>HYDRA</h1>
        <div class="subtitle">Secure Gateway</div>

        <div class="input-group">
            <label for="hwidInput">IDENTIFIER (HWID)</label>
            <input type="text" id="hwidInput" placeholder="Paste Client ID from F9 Console...">
        </div>

        <button class="btn" onclick="claimKey()">Activate Access</button>
        
        <div id="status"></div>

        <div class="info-box">
            <b>How to use:</b><br>
            1. Run the script in Roblox Arsenal.<br>
            2. Copy your <b>HWID</b> from the F9 console.<br>
            3. Paste it above and click activate.<br>
            4. Re-execute the script in-game.
        </div>
    </div>

    <script>
        function claimKey() {
            const hwid = document.getElementById('hwidInput').value.trim();
            const status = document.getElementById('status');

            if (hwid.length < 10) {
                status.innerText = "Invalid Identifier Provided";
                status.style.color = "#ff4444";
                return;
            }

            status.innerHTML = "Authenticating<span class='loading-dots'></span>";
            status.style.color = "#00bfff";

            // Simulating API call to your Render backend
            fetch(`/claim?hwid=${hwid}`)
            .then(res => res.text())
            .then(data => {
                if (data === "Success") {
                    status.innerText = "SUCCESS: ACCESS GRANTED FOR 24H";
                    status.style.color = "#00ff88";
                    document.getElementById('hwidInput').style.borderColor = "#00ff88";
                } else {
                    status.innerText = "ERROR: SYSTEM OFFLINE";
                    status.style.color = "#ff4444";
                }
            })
            .catch(err => {
                status.innerText = "CONNECTION ERROR: SERVER SLEEPING";
                status.style.color = "#ffbb00";
            });
        }
    </script>
</body>
</html>
